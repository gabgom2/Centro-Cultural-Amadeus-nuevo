{% extends "app_index/index.html" %}
<!-- archivo padre para "Registros Asignaturas" -->

{% block contenido_principal %}


    <!-- BANNER -->
    <div class="banner">
        {% block titulo_registro %}
        <h1>Registrar Asignatura</h1>
        {% endblock %}
    </div>

    <div class="container mt-4">

        <!-- Mostrar mensajes -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success text-center" role="alert" id="mensaje-exito">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- Formulario -->
        
        <form method = "POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">
            Registrar
            </button>

        </form>
    </div>



{% endblock %}
